  <template id="arbeit-oeffentlich">
    <main class="e-main e-ref" id="inhalt"><header class="e-title"><div class="e-kennung"><p class="e-meta e-meta--accent">Arbeit 01 · Banking</p><p class="e-meta">Eigenes Projekt, 2024</p></div><h1 class="e-display" id="titel"><span>Banking, das</span> <span class="e-it">Fragen beantwortet.</span></h1><div class="e-kurz"><p class="e-lead">aiba – KI-Assistent fürs mobile Banking</p><p class="e-small e-muted">Ich habe aiba 2024 entworfen, als Chat in Banking-Apps noch Zukunft war. Heute steht genau diese Funktion auf den Roadmaps der Banken. Die Idee bringt zusammen, was ich in neun Jahren für DKB, Atruvia und weitere Banken gebaut habe: Sprachsteuerung, Chat-Assistenten und sichere Zahlungen.</p></div></header><section aria-labelledby="blick" class="e-sec e-sec--tight e-stack"><h2 class="e-label" id="blick">Auf einen Blick</h2><div class="e-kpis"><div class="e-kpi"><p class="e-kpi__value"><span class="e-sr">9</span><span aria-hidden="true" data-count="">9</span></p><p class="e-kpi__text">Jahre Design für Banken</p></div><div class="e-kpi"><p class="e-kpi__value"><span class="e-sr">8</span><span aria-hidden="true" data-count="">8</span></p><p class="e-kpi__text">Banken, von der Direktbank bis zur Privatbank</p></div><div class="e-kpi"><p class="e-kpi__value"><span class="e-sr">2</span><span aria-hidden="true" data-count="">2</span></p><p class="e-kpi__text">Schritte bis zur Überweisung</p></div></div></section><div class="e-sec e-sec--tight"><figure class="e-fig"><div class="e-aibahero"><video aria-label="Zwei Smartphones mit der Banking-App aiba: links der KI-Assistent („Hello Marc, how can I help you?“), rechts die Startseite mit Gesamtsaldo, Konto, Sparen und Depot" class="e-aibahero__video e-aibahero__video--light" data-src="../media/aiba-hero-light.mp4" data-still="../media/aiba-hero-light-end.webp" height="942" muted="" playsinline="" poster="../media/aiba-hero-light-poster.webp?v=2" preload="none" width="1080"></video><video aria-label="Zwei Smartphones mit der Banking-App aiba: links der KI-Assistent („Hello Marc, how can I help you?“), rechts die Startseite mit Gesamtsaldo, Konto, Sparen und Depot" class="e-aibahero__video e-aibahero__video--dark" data-src="../media/aiba-hero-dark.mp4" data-still="../media/aiba-hero-dark-end.webp" height="942" muted="" playsinline="" poster="../media/aiba-hero-dark-poster.webp?v=2" preload="none" width="1080"></video></div><figcaption class="e-caption">01 · aiba · KI-Assistent fürs mobile Banking</figcaption></figure></div><section aria-label="Steckbrief" class="e-sec"><dl class="e-facts"><div><dt>Jahr</dt><dd>2024</dd></div><div><dt>Plattform</dt><dd>iOS</dd></div><div><dt>Leistungen</dt><dd>Konzept, UX, UI, Prototyp</dd></div></dl></section><section aria-labelledby="s01" class="e-sec e-stack"><h2 class="e-mark" id="s01">01 / Ausgangslage</h2><p class="e-heading">Von Kontodaten zu Antworten.</p><div class="e-cols"><div class="e-col"><h3>Problem</h3><p class="e-body">Banking-Apps zeigen Umsätze, aber die Auswertung bleibt bei den Kunden: filtern, scrollen, selbst rechnen.</p></div><div class="e-col"><h3>Ziel</h3><p class="e-body">Eine App, die Fragen zu den eigenen Finanzen beantwortet und direkt handelt.</p></div><div class="e-col"><h3>Herkunft</h3><p class="e-body">Ausgangspunkt war KIU, der KI-Chat-Assistent der Atruvia, an dessen ersten Studien ich gearbeitet habe. Als ChatGPT zeigte, was möglich ist, habe ich die Idee in einer eigenen Studie weitergeführt – die restliche App ist um diesen Assistenten herumgebaut. Dazu kommen Erfahrungen aus der Siri-Integration der DKB und dem Intent-Training für Alexa und Siri.</p></div></div></section><section aria-labelledby="s02" class="e-sec e-stack e-stack--block"><h2 class="e-mark" id="s02">02 / Vorgehen</h2><div class="e-step"><div class="e-step__head"><p class="e-step__label">Schritt 1</p><div class="e-step__row"><h3 class="e-step__title">Fragen statt suchen</h3><p class="e-body">Eine Frage genügt, gesprochen oder getippt. aiba nennt die Summe, zeigt die Einzelposten und legt die Auswertung als PDF ab.</p></div></div><figure class="e-fig"><div class="e-stage e-stage--sequence"><video aria-label="Animation: Frage per Sprache, Antwort mit Summe, Einzelposten und PDF-Export" class="e-video e-video--phone" data-src="../media/aiba-voice-loop.mp4" height="1686" loop="" muted="" playsinline="" poster="../media/aiba-voice-poster.webp" preload="none" width="778"></video><ol aria-label="Ablauf im Video" class="e-sequence"><li><span class="e-sequence__num">01</span><span class="e-sequence__text"><span class="e-sequence__title">Fragen per Sprache</span><span class="e-sequence__desc">Die Frage wird diktiert statt getippt – der Assistent hört zu und transkribiert live.</span></span></li><li><span class="e-sequence__num">02</span><span class="e-sequence__text"><span class="e-sequence__title">Antwort mit Summe</span><span class="e-sequence__desc">Der Betrag steht sofort da, passende Folgefragen werden vorgeschlagen.</span></span></li><li><span class="e-sequence__num">03</span><span class="e-sequence__text"><span class="e-sequence__title">Details per Vorschlag</span><span class="e-sequence__desc">Ein Tipp auf „List details“ zeigt die Einzelposten.</span></span></li><li><span class="e-sequence__num">04</span><span class="e-sequence__text"><span class="e-sequence__title">Als PDF sichern</span><span class="e-sequence__desc">„Yes“ genügt – die Auswertung liegt als PDF zum Download bereit.</span></span></li></ol></div><figcaption class="e-caption">02 · Fragen statt suchen · Frage per Sprache, Antwort, Einzelposten, PDF</figcaption></figure></div><div class="e-step"><div class="e-step__head"><p class="e-step__label">Schritt 2</p><div class="e-step__row"><h3 class="e-step__title">Zahlen in zwei Schritten</h3><p class="e-body">Empfänger, Betrag, fertig. Bestätigt wird per Wischgeste, damit nichts aus Versehen rausgeht.</p></div></div><figure class="e-fig"><div class="e-stage e-stage--phones"><img alt="Betrag wählen: Schnellbeträge von 10 € bis 150 € für Kaylynn Baccaro" height="548" loading="lazy" src="../img/arbeiten/aiba-05.webp" style="--w:240px" width="262"/><img alt="Zahlungsübersicht mit Empfängerin und 100,00 EUR, Nachricht und Bild noch leer" height="548" loading="lazy" src="../img/arbeiten/aiba-06.webp" style="--w:240px" width="262"/><img alt="Zahlungsübersicht mit hinzugefügtem Foto, Button „Confirm payment“" height="548" loading="lazy" src="../img/arbeiten/aiba-07.webp" style="--w:240px" width="262"/><img alt="Nachricht schreiben: „Thanks a lot!“ mit eingeblendeter Tastatur" height="548" loading="lazy" src="../img/arbeiten/aiba-08.webp" style="--w:240px" width="262"/></div><figcaption class="e-caption">03 · Zahlen in zwei Schritten · Empfänger, Betrag, Bestätigen per Wischgeste</figcaption></figure></div><div class="e-step"><div class="e-step__head"><p class="e-step__label">Schritt 3</p><div class="e-step__row"><h3 class="e-step__title">Alle Konten an einem Ort</h3><p class="e-body">Konto, Sparen und Depot in einem Saldo, die Karten in einer Wallet.</p></div></div></div></section><section aria-labelledby="s03" class="e-sec e-stack"><h2 class="e-mark" id="s03">03 / Ergebnis</h2><div class="e-step"><div class="e-step__head"><div class="e-step__row"><h3 class="e-step__title">Der Zeit voraus – von 2024 bis heute.</h3><p class="e-body">Was 2024 ein Entwurf war, ist heute Standard-Roadmap vieler Banken. aiba zeigt, wie Sprache, Chat und Zahlung in einer Oberfläche zusammenfinden – ohne dass Sicherheit zur Hürde wird.</p></div></div><figure class="e-fig"><div class="e-stage"><ul class="e-logos"><li><img alt="Aareal Bank" height="25" loading="lazy" src="../img/arbeiten/aiba-09.webp" style="--lw:110" width="110"/></li><li><img alt="Aargauische Kantonalbank" height="28" loading="lazy" src="../img/arbeiten/aiba-10.webp" style="--lw:139" width="139"/></li><li><img alt="apoBank" height="39" loading="lazy" src="../img/arbeiten/aiba-11.webp" style="--lw:106" width="106"/></li><li><img alt="DKB – Deutsche Kreditbank" height="37" loading="lazy" src="../img/arbeiten/aiba-12.webp" style="--lw:73" width="73"/></li><li><img alt="Donner &amp; Reuschel" height="47" loading="lazy" src="../img/arbeiten/aiba-13.webp" style="--lw:124" width="124"/></li><li><img alt="DZ Privatbank" height="14" loading="lazy" src="../img/arbeiten/aiba-14.webp" style="--lw:174" width="174"/></li><li><img alt="Fidor Bank" height="38" loading="lazy" src="../img/arbeiten/aiba-15.webp" style="--lw:93" width="93"/></li><li><img alt="Volksbanken Raiffeisenbanken" height="24" loading="lazy" src="../img/arbeiten/aiba-16.webp" style="--lw:144" width="144"/></li></ul></div><figcaption class="e-caption">04 · Banken, für die ich gearbeitet habe</figcaption></figure></div></section><nav aria-label="Zwischen den Arbeiten blättern" class="e-pager"><span></span><a aria-label="Weiter: Arbeit 02 · Design System" href="#arbeit-02" rel="next" title="Arbeit 02 · Design System"><span class="e-pager__label">Weiter</span><span aria-hidden="true" class="e-arrow"><svg aria-hidden="true" class="arrow lucide lucide-arrow-right" fill="none" focusable="false" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span></a></nav></main>
